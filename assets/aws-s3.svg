<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="s3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#E05243" />
    </linearGradient>
    <filter id="s3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <g filter="url(#s3-shadow)">
    <!-- Hexagonal or Rounded Container -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#s3-grad)" />
    
    <!-- AWS S3 Stylized Bucket Graphic -->
    <!-- Top Lip of Bucket -->
    <ellipse cx="50" cy="35" rx="20" ry="6" fill="#FFFFFF" fill-opacity="0.3" />
    <ellipse cx="50" cy="35" rx="16" ry="4" fill="#FFFFFF" />
    
    <!-- S3 Storage Layers -->
    <path d="M30,35 C30,35 30,55 50,55 C70,55 70,35 70,35 L68,60 C68,66 50,68 50,68 C50,68 32,66 32,60 Z" fill="#FFFFFF" fill-opacity="0.9" />
    
    <!-- Central Bucket Stripe/Accents -->
    <ellipse cx="50" cy="48" rx="18" ry="5" fill="#E05243" fill-opacity="0.2" />
    <path d="M32,48 C32,53 50,55 50,55 C50,55 68,53 68,48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M33,60 C33,65 50,67 50,67 C50,67 67,65 67,60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Document/Object representation coming out of S3 -->
    <path d="M45,20 L55,20 L55,28 L45,28 Z" fill="#FFFFFF" transform="rotate(15 50 24)" />
    <circle cx="50" cy="15" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
