<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="45" />
    </clipPath>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#avatar-grad)" stroke-width="2" opacity="0.6" />
  
  <g clip-path="url(#circle-clip)">
    <!-- Background -->
    <rect width="100" height="100" fill="#F3F4F6" />
    <circle cx="50" cy="50" r="45" fill="#E5E7EB" />
    
    <!-- User Avatar Silhouette -->
    <!-- Head -->
    <circle cx="50" cy="38" r="18" fill="url(#avatar-grad)" />
    
    <!-- Body/Shoulders -->
    <path d="M15,85 C15,68 30,62 50,62 C70,62 85,68 85,85 Z" fill="url(#avatar-grad)" />
    
    <!-- Code glasses/detail -->
    <path d="M38,36 H62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="43" cy="36" r="4" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="57" cy="36" r="4" fill="none" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Mini floating cloud to represent DevOps / Cloud Engineering -->
    <path d="M72,42 C72,40 75,38 78,38 C81,38 83,40 83,42 C84.5,42 86,43.5 86,45 C86,46.5 84.5,48 83,48 H72 C70.5,48 69,46.5 69,45 C69,43.5 70.5,42 72,42 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
