<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="mcp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="mcp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <g filter="url(#mcp-shadow)">
    <!-- Outer rounded panel -->
    <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#mcp-grad)" />
    
    <!-- Protocol Central Hub Node -->
    <circle cx="50" cy="50" r="12" fill="#FFFFFF" />
    
    <!-- Connecting lines to sub-nodes -->
    <!-- Line to top left -->
    <line x1="50" y1="50" x2="28" y2="28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Line to top right -->
    <line x1="50" y1="50" x2="72" y2="28" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Line to bottom center -->
    <line x1="50" y1="50" x2="50" y2="76" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 1" />
    <line x1="50" y1="50" x2="50" y2="76" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.6" />
    
    <!-- Peripheral Nodes (representing context, models, and tools) -->
    <!-- AI Model (Top Left) -->
    <circle cx="28" cy="28" r="8" fill="#FFFFFF" />
    <circle cx="28" cy="28" r="4" fill="#0066FF" />
    
    <!-- Data/Context (Top Right) -->
    <polygon points="72,21 79,33 65,33" fill="#FFFFFF" />
    
    <!-- Tools (Bottom Center) -->
    <rect x="44" y="70" width="12" height="12" rx="3" fill="#FFFFFF" />
    <rect x="47" y="73" width="6" height="6" rx="1.5" fill="#00D2FF" />
    
    <!-- Connection waves/signals -->
    <path d="M40,38 A15,15 0 0,1 60,38" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M35,33 A22,22 0 0,1 65,33" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />
  </g>
</svg>
